name: Deploy (Vercel)

# Preview deploy on every PR, production deploy on push to main.
# Requires three repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — a Vercel access token (Account → Settings → Tokens)
#   VERCEL_ORG_ID      — team_6xaQFg6rP37GuNDynoQPVfyc
#   VERCEL_PROJECT_ID  — prj_vHuArDx1vHWWRew74r6A5rByc4YG
# If the secrets are absent (e.g. on a fork), the job no-ops instead of failing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# The preview step comments the deploy URL on the PR, which needs write access
# to pull requests; contents stays read-only.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Vercel token
        id: guard
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN not set — skipping deploy."
          fi

      - name: Set up Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install --global vercel@latest

      # --- Preview deploy (pull requests) ------------------------------------
      - name: Pull Vercel env (preview)
        if: steps.guard.outputs.enabled == 'true' && github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (preview)
        if: steps.guard.outputs.enabled == 'true' && github.event_name == 'pull_request'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: preview
        if: steps.guard.outputs.enabled == 'true' && github.event_name == 'pull_request'
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        # A successful deploy shouldn't be marked failed just because the
        # comment couldn't be posted (e.g. token scope on a fork).
        continue-on-error: true
        if: steps.guard.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}'
            if (!url) return
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔍 **Vercel preview deployed:** ${url}`,
            })

      # --- Production deploy (push to main) ----------------------------------
      - name: Pull Vercel env (production)
        if: steps.guard.outputs.enabled == 'true' && github.event_name == 'push'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        if: steps.guard.outputs.enabled == 'true' && github.event_name == 'push'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        if: steps.guard.outputs.enabled == 'true' && github.event_name == 'push'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
